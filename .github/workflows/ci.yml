name: CI

# Pipeline for day-to-day development: every pull request against main and
# every merge/push to main is analyzed, tested and built for all three target
# platforms. The resulting binaries are attached to the run and can be
# downloaded from its Summary page under "Artifacts".
#
# Releases are cut by a separate pipeline (`release.yml`), triggered by a tag.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch / PR supersedes the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      retention-days: 14
