name: Release

# Release pipeline: triggered by pushing a version tag (e.g. `v1.0.0`).
#
# It re-runs the full analyze/test/build matrix from the tagged commit and then
# publishes every artifact — APK, Play Store bundle, Windows .zip and Linux
# .tar.gz — on the repository's GitHub Releases page, with auto-generated
# release notes.
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# A tag containing a hyphen (e.g. `v1.1.0-rc.1`) is published as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ github.ref_name }}
      retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lh artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
