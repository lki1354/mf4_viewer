name: CI / Release

# One pipeline that tests the engine and builds every distributable artifact for
# the CAN-log → MF4 converter / viewer:
#
#   * test    — `flutter analyze` + `flutter test` (the conversion engine and
#               its round-trip tests). All build jobs depend on this passing.
#   * android — release APK + Play Store App Bundle (.aab).
#   * windows — zipped Windows x64 build (.exe + DLLs + data/).
#   * linux   — tarred Linux x64 bundle.
#   * release — on a version tag (e.g. v1.0.0), gathers every artifact and
#               publishes them on the GitHub Releases page.
#
# On every push to main / PR the artifacts are downloadable from the run's
# Summary page; tagging additionally creates a public Release. The pipeline can
# also be started manually from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Collect artifacts
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/mf4_viewer-${version}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/mf4_viewer-${version}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: mf4_viewer-android
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '/', '-'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/mf4_viewer-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mf4_viewer-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Build Linux (x64 bundle)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux build
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME//\//-}"
          tar -C build/linux/x64/release/bundle \
              -czf "dist/mf4_viewer-${version}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: mf4_viewer-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [android, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
